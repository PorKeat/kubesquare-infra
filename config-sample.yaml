apiVersion: kubekey.kubesphere.io/v1alpha2
kind: Cluster
metadata:
  name: sample
spec:
  hosts:
    - {name: master1, address: 10.148.0.3, internalAddress: 10.148.0.3, user: alexkgm2412, password: "1234"}
    - {name: master2, address: 10.148.0.4, internalAddress: 10.148.0.4, user: alexkgm2412, password: "1234"}
    - {name: master3, address: 10.148.0.5, internalAddress: 10.148.0.5, user: alexkgm2412, password: "1234"}
  roleGroups:
    etcd:
      - master1
      - master2
      - master3
    control-plane:
      - master1
      - master2
      - master3
    worker: []
---
apiVersion: kubekey.kubesphere.io/v1
kind: Config
spec:
  zone: ""
  kubernetes:
    kube_version: v1.34.3
    helm_version: v3.18.5
    sandbox_image:
      tag: "3.10.1"
    extra_args:
      kubelet:
        - --system-reserved=cpu=500m,memory=1Gi
        - --kube-reserved=cpu=300m,memory=500Mi
        - --eviction-hard=memory.available<500Mi,nodefs.available<10%
    control_plane_endpoint:
      type: kube-vip
      kube_vip:
        image:
          tag: v0.7.2
  etcd:
    etcd_version: v3.6.5
  image_registry:
    type: ""
    ha_vip: ""
  cri:
    container_manager: containerd
    crictl_version: v1.34.0
  # Cilium CNI with eBPF support for network policies & namespace isolation
  cni:
    type: cilium
    multi_cni: none
    cilium_version: 1.19.1
  storage_class:
    # Disabled default local storage in favor of Longhorn distributed storage
    local:
      enabled: false
      default: false
    nfs:
      enabled: false
  dns:
    coredns:
      image:
        tag: v1.12.1
    nodelocaldns:
      enabled: true
      image:
        tag: 1.26.4
  image_manifests: []
